<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Range Equation</title>
    <style>
        :root {
            --blue-dark: #003264;
            --blue-medium: #004b96;
            --blue-standard: #0073eb;
            --blue-light: #469cf0;
            --grey-dark: #404040;
            --grey-medium: #808080;
            --grey-light: #bfbfbf;
            --white: #ffffff;
            --success: #1e8e3e;
            --error: #c62828;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--white);
            color: var(--grey-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin: 32px 0 24px;
            padding: 0 16px;
        }

        header h1 {
            margin: 0;
            font-size: 1.9rem;
            font-weight: 600;
            color: var(--blue-dark);
            letter-spacing: 0.3px;
        }

        header p {
            margin: 6px 0 0;
            color: var(--grey-medium);
            font-size: 0.95rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 90%;
            max-width: 800px;
            gap: 20px;
            margin-bottom: 40px;
        }

        #sim-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: var(--white);
            border: 1px solid var(--grey-light);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 50, 100, 0.08);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .canvas-instruction {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--white);
            padding: 7px 18px;
            border-radius: 20px;
            border: 1px solid var(--grey-light);
            font-size: 0.8rem;
            pointer-events: none;
            letter-spacing: 0.2px;
            color: var(--grey-dark);
            white-space: nowrap;
            transition: opacity 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 50, 100, 0.08);
            max-width: 90%;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .panel {
            background-color: var(--white);
            border: 1px solid var(--grey-light);
            border-radius: 10px;
            padding: 22px;
            box-shadow: 0 4px 16px rgba(0, 50, 100, 0.06);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--white);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--grey-light);
            border-left: 4px solid var(--blue-standard);
        }

        .stat-label {
            font-size: 0.78rem;
            color: var(--grey-medium);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.15rem;
            font-weight: 600;
            margin-top: 4px;
            color: var(--blue-dark);
        }

        .formula-box {
            background: var(--white);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px dashed var(--grey-light);
            overflow-x: auto;
        }

        .formula-box h3 {
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--blue-medium);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .formula {
            font-family: 'Consolas', monospace;
            font-size: 1.1rem;
            color: var(--grey-dark);
            white-space: nowrap;
        }

        .quiz-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="number"] {
            flex: 1;
            min-width: 180px;
            background: var(--white);
            border: 1px solid var(--grey-light);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--grey-dark);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            border-color: var(--blue-standard);
            box-shadow: 0 0 0 3px rgba(0, 115, 235, 0.12);
        }

        input[type="number"]:disabled {
            background: #fafafa;
            color: var(--grey-medium);
        }

        button {
            background-color: var(--blue-dark);
            color: var(--white);
            border: none;
            padding: 12px 26px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover:not(:disabled) {
            background-color: var(--blue-medium);
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: var(--grey-light);
            color: var(--white);
            cursor: not-allowed;
        }

        #feedback {
            font-weight: 500;
            min-height: 24px;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .success { color: var(--success); }
        .error { color: var(--error); }

        @media (max-width: 600px) {
            .container {
                width: 95%;
                gap: 15px;
            }

            header {
                margin: 20px 0 16px;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .panel {
                padding: 15px;
            }

            .input-group {
                flex-direction: column;
            }

            input[type="number"], button {
                width: 100%;
            }

            #sim-container {
                height: 280px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Radar Range Equation</h1>
        <p>Transmit a pulse and calculate the distance to the target</p>
    </header>

    <div class="container">
        <!-- Simulation Canvas -->
        <div id="sim-container">
            <canvas id="radarCanvas"></canvas>
            <div class="canvas-instruction" id="instruction-text">Click the target to transmit a radar pulse!</div>
        </div>

        <!-- Dashboard & Quiz Panel -->
        <div class="panel">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Round Trip Time</div>
                    <div class="stat-value" id="val-time">-- s</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Speed of Light</div>
                    <div class="stat-value">300,000 km/s</div>
                </div>
            </div>

            <div class="formula-box">
                <h3>Radar Range Equation (Distance to Target)</h3>
                <div class="formula">Distance = (Speed of Light &times; Round Trip Time) / 2</div>
            </div>

            <div class="quiz-section">
                <div id="feedback"></div>
                <div class="input-group">
                    <input type="number" id="user-range" placeholder="Enter calculated range in km..." disabled>
                    <button id="submit-btn" onclick="checkAnswer()" disabled>Submit</button>
                    <button id="next-btn" onclick="nextRound()" style="display:none;">Next Target</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');

        const timeDisplay = document.getElementById('val-time');
        const userRangeInput = document.getElementById('user-range');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedbackEl = document.getElementById('feedback');
        const instructionEl = document.getElementById('instruction-text');

        let width, height;
        let radarPos = { x: 80, y: 0 };
        let planePos = { x: 0, y: 0 };

        // Native aspect ratios of the provided artwork - used only for scaling,
        // never for rotation. Images are always drawn upright / at their
        // original angle exactly as provided.
        const RADAR_NATIVE_W = 125;
        const RADAR_NATIVE_H = 248;
        const AIRCRAFT_NATIVE_W = 499;
        const AIRCRAFT_NATIVE_H = 226;

        const C = 3e8; // Speed of light in m/s
        let actualRangeMeters = 0;
        let roundTripTimeSec = 0;

        // Adjust this to control how fast the pulse animation plays.
        // Higher = faster animation, lower = slower animation.
        // This is the amount pulseProgress advances per animation frame
        // (pulseProgress runs from 0 to 2: 0-1 outbound, 1-2 return).
        const PULSE_SPEED = 0.002;

        let state = 'IDLE';
        let pulseProgress = 0;

        // Load external images
        const radarImg = new Image();
        radarImg.src = 'graphics/icon-radar.png';

        const aircraftImg = new Image();
        aircraftImg.src = 'graphics/icon-aircraft.png';

        function resizeCanvas() {
            const container = canvas.parentElement;
            width = container.clientWidth;
            height = container.clientHeight;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);

            // Radar station stands flat on the ground line.
            radarPos = { x: Math.max(50, width * 0.12), y: height - 50 };

            if (state === 'IDLE') {
                resetPlanePosition();
            }
        }

        function resetPlanePosition() {
            const possibleTimesMs = [1.0, 1.2, 1.5, 1.8, 2.0, 2.2, 2.5];
            const chosenTimeMs = possibleTimesMs[Math.floor(Math.random() * possibleTimesMs.length)];

            roundTripTimeSec = chosenTimeMs / 1000;

            actualRangeMeters = (C * roundTripTimeSec) / 2;
            const distKm = actualRangeMeters / 1000;

            const maxPxDist = Math.min(width - 140, 560);
            const pxDist = Math.min(Math.max((distKm / 350) * maxPxDist, 120), maxPxDist);

            // Aircraft always flies along the same shallow ascending path,
            // matching the fixed angle baked into the artwork itself.
            const angle = -Math.PI / 9;
            const flightBaseY = height * 0.42;
            planePos = {
                x: radarPos.x + 90 + Math.cos(angle) * pxDist * 0.75,
                y: flightBaseY - Math.sin(-angle) * (pxDist * 0.12)
            };
            // Keep the plane within a comfortable vertical band.
            planePos.y = Math.min(Math.max(planePos.y, height * 0.18), height * 0.55);
            // Ensure the plane doesn't overflow right on small screens
            if (planePos.x > width - 60) {
                planePos.x = width - 60;
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        canvas.addEventListener('click', (event) => {
            if (state !== 'IDLE') return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;
            const distToPlane = Math.hypot(mouseX - planePos.x, mouseY - planePos.y);

            if (distToPlane < 60 || mouseY < height / 2) {
                startPulse();
            }
        });

        function startPulse() {
            state = 'TRANSMITTING';
            pulseProgress = 0;
            instructionEl.style.opacity = '0';
            userRangeInput.disabled = true;
            submitBtn.disabled = true;
            feedbackEl.textContent = '';
        }

        function updateAnimation() {
            if (state === 'TRANSMITTING' || state === 'RETURNING') {
                pulseProgress += PULSE_SPEED;

                if (pulseProgress >= 2.0) {
                    pulseProgress = 2.0;
                    state = 'ANSWERING';

                    timeDisplay.textContent = `${roundTripTimeSec.toFixed(4)} s`;

                    userRangeInput.disabled = false;
                    submitBtn.disabled = false;
                    userRangeInput.focus();
                    instructionEl.textContent = "Pulse returned! Calculate and enter the range below.";
                    instructionEl.style.opacity = '1';
                }
            }
        }

        function drawScene() {
            ctx.clearRect(0, 0, width, height);

            // Sky background - subtle light blue gradient
            const sky = ctx.createLinearGradient(0, 0, 0, height);
            sky.addColorStop(0, '#f5faff');
            sky.addColorStop(1, '#ffffff');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, width, height);

            // Ground
            ctx.fillStyle = '#f0f2f4';
            ctx.fillRect(0, height - 50, width, 50);
            ctx.strokeStyle = 'rgb(192, 192, 192)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, height - 50);
            ctx.lineTo(width, height - 50);
            ctx.stroke();

            // Radar Beam / Dotted Expanding Pulse - drawn first so it sits
            // behind the radar and aircraft artwork.
            const radarHeight = 100;
            const radarWidth = radarHeight * (RADAR_NATIVE_W / RADAR_NATIVE_H);
            const aircraftWidth = Math.min(90, width * 0.2);
            const aircraftHeight = aircraftWidth * (AIRCRAFT_NATIVE_H / AIRCRAFT_NATIVE_W);

            if (state === 'TRANSMITTING' || state === 'RETURNING' || state === 'ANSWERING') {
                const pivotY = radarPos.y - radarHeight * 0.72;
                const pivotX = radarPos.x + radarWidth * 0.18;

                ctx.strokeStyle = 'rgba(0, 115, 235, 0.85)';
                ctx.lineWidth = 3;
                ctx.setLineDash([6, 6]);

                if (pulseProgress < 1.0) {
                    // Outbound: line grows from the radar out to the aircraft.
                    const tipX = pivotX + (planePos.x - pivotX) * pulseProgress;
                    const tipY = pivotY + (planePos.y - pivotY) * pulseProgress;
                    ctx.beginPath();
                    ctx.moveTo(pivotX, pivotY);
                    ctx.lineTo(tipX, tipY);
                    ctx.stroke();
                } else if (pulseProgress > 1.0 && pulseProgress < 2.0) {
                    // Inbound: line grows from the aircraft back to the radar,
                    // i.e. it travels from the plane toward the radar.
                    const returnProgress = pulseProgress - 1.0;
                    const tipX = planePos.x + (pivotX - planePos.x) * returnProgress;
                    const tipY = planePos.y + (pivotY - planePos.y) * returnProgress;
                    ctx.beginPath();
                    ctx.moveTo(planePos.x, planePos.y);
                    ctx.lineTo(tipX, tipY);
                    ctx.stroke();
                }
                // At exactly pulseProgress === 1.0 the line briefly disappears
                // before the return trip begins, and once it reaches 2.0 the
                // return line disappears as well.

                ctx.setLineDash([]);
            }

            // Draw Radar Image - always upright, base flat on the ground line, no rotation.
            ctx.drawImage(
                radarImg,
                radarPos.x - radarWidth / 2,
                radarPos.y - radarHeight,
                radarWidth,
                radarHeight
            );

            // Draw Aircraft Image - always drawn at its original fixed angle, no rotation.
            ctx.drawImage(
                aircraftImg,
                planePos.x - aircraftWidth / 2,
                planePos.y - aircraftHeight / 2,
                aircraftWidth,
                aircraftHeight
            );
        }

        function loop() {
            updateAnimation();
            drawScene();
            requestAnimationFrame(loop);
        }

        loop();

        function checkAnswer() {
            const userVal = parseFloat(userRangeInput.value);
            if (isNaN(userVal)) {
                feedbackEl.textContent = "Please enter a valid number.";
                feedbackEl.className = 'error';
                return;
            }

            const correctRangeKm = Math.round(actualRangeMeters / 1000);
            const tolerance = 1;

            if (Math.abs(userVal - correctRangeKm) <= tolerance) {
                feedbackEl.textContent = `Correct! The range to the target is exactly ${correctRangeKm} km.`;
                feedbackEl.className = 'success';
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'inline-block';
                userRangeInput.disabled = true;
            } else {
                feedbackEl.textContent = `Incorrect. The correct answer was ${correctRangeKm} km.`;
                feedbackEl.className = 'error';
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'inline-block';
                userRangeInput.disabled = true;
            }
        }

        function nextRound() {
            state = 'IDLE';
            pulseProgress = 0;
            timeDisplay.textContent = '-- s';
            userRangeInput.value = '';
            userRangeInput.disabled = true;
            submitBtn.disabled = true;
            submitBtn.style.display = 'inline-block';
            nextBtn.style.display = 'none';
            feedbackEl.textContent = '';
            instructionEl.textContent = "Click the target to transmit a new radar pulse!";
            instructionEl.style.opacity = '1';
            resetPlanePosition();
        }
    </script>
</body>
</html>
