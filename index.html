<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Quiz</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --accent-dim: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #4ade80;
            --error: #f87171;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin: 20px 0;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent);
        }

        header p {
            margin: 5px 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 90%;
            max-width: 800px;
            gap: 20px;
            margin-bottom: 30px;
        }

        #sim-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: radial-gradient(ellipse at 50% 100%, #0c1a2e 0%, #020617 70%);
            border: 2px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .canvas-instruction {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #475569;
            font-size: 0.8rem;
            pointer-events: none;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #0f172a;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 4px;
        }

        .formula-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px dashed #475569;
        }

        .formula-box h3 {
            margin: 0 0 8px 0;
            font-size: 0.95rem;
            color: var(--accent);
        }

        .formula {
            font-family: monospace;
            font-size: 1.1rem;
            color: #e2e8f0;
        }

        .quiz-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="number"] {
            flex: 1;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }

        #feedback {
            font-weight: 500;
            min-height: 24px;
            font-size: 0.95rem;
        }

        .success { color: var(--success); }
        .error { color: var(--error); }
    </style>
</head>
<body>

    <header>
        <h1>Radar Quiz</h1>
    </header>

    <div class="container">
        <!-- Simulation Canvas -->
        <div id="sim-container">
            <canvas id="radarCanvas"></canvas>
            <div class="canvas-instruction" id="instruction-text">Click the airplane to transmit a radar pulse!</div>
        </div>

        <!-- Dashboard & Quiz Panel -->
        <div class="panel">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Round Trip Time</div>
                    <div class="stat-value" id="val-time">-- s</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Speed of Light</div>
                    <div class="stat-value">300,000 km/s</div>
                </div>
            </div>

            <div class="formula-box">
                <h3>Radar Range Equation (Distance to Target)</h3>
                <div class="formula">Distance = (Speed of Light × Round Trip Time) / 2</div>
            </div>

            <div class="quiz-section">
                <div id="feedback"></div>
                <div class="input-group">
                    <input type="number" id="user-range" placeholder="Enter calculated range in km..." disabled>
                    <button id="submit-btn" onclick="checkAnswer()" disabled>Submit Answer</button>
                    <button id="next-btn" onclick="nextRound()" style="display:none;">Next Target</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');

        const timeDisplay = document.getElementById('val-time');
        const userRangeInput = document.getElementById('user-range');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedbackEl = document.getElementById('feedback');
        const instructionEl = document.getElementById('instruction-text');

        let width, height;
        let radarPos = { x: 80, y: 0 };
        let planePos = { x: 0, y: 0 };
        let planeAngle = -Math.PI / 6;

        const C = 3e8; // Speed of light in m/s
        let actualRangeMeters = 0;
        let roundTripTimeSec = 0;

        let state = 'IDLE';
        let pulseProgress = 0;
        let dishAngle = 0;
        let bgStars = [];

        function resizeCanvas() {
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;

            radarPos = { x: 65, y: height - 55 };

            if (bgStars.length === 0) {
                for (let i = 0; i < 45; i++) {
                    bgStars.push({
                        x: Math.random() * width,
                        y: Math.random() * (height * 0.7),
                        r: Math.random() * 1.3 + 0.3,
                        tw: Math.random() * Math.PI * 2
                    });
                }
            }

            if (state === 'IDLE') {
                resetPlanePosition();
            }
        }

        function resetPlanePosition() {
            const possibleTimesMs = [1.0, 1.2, 1.5, 1.8, 2.0, 2.2, 2.5];
            const chosenTimeMs = possibleTimesMs[Math.floor(Math.random() * possibleTimesMs.length)];

            roundTripTimeSec = chosenTimeMs / 1000;

            actualRangeMeters = (C * roundTripTimeSec) / 2;
            const distKm = actualRangeMeters / 1000;

            // Ensure the airplane stays well within the canvas bounds by capping pxDist based on current width
            const maxPxDist = Math.min(width - 120, 550);
            const pxDist = Math.min(Math.max((distKm / 350) * maxPxDist, 100), maxPxDist);

            const angle = -Math.PI / 6;
            planePos = {
                x: radarPos.x + Math.cos(angle) * pxDist,
                y: radarPos.y + Math.sin(angle) * pxDist
            };
            planeAngle = angle;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        canvas.addEventListener('click', (event) => {
            if (state !== 'IDLE') return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (event.clientX - rect.left) * scaleX;
            const mouseY = (event.clientY - rect.top) * scaleY;
            const distToPlane = Math.hypot(mouseX - planePos.x, mouseY - planePos.y);

            if (distToPlane < 60 || mouseY < height / 2) {
                startPulse();
            }
        });

        function startPulse() {
            state = 'TRANSMITTING';
            pulseProgress = 0;
            instructionEl.style.opacity = '0';
            userRangeInput.disabled = true;
            submitBtn.disabled = true;
            feedbackEl.textContent = '';
        }

        function updateAnimation() {
            dishAngle += 0.01;

            if (state === 'TRANSMITTING' || state === 'RETURNING') {
                pulseProgress += 0.012;

                if (pulseProgress >= 2.0) {
                    pulseProgress = 2.0;
                    state = 'ANSWERING';

                    timeDisplay.textContent = `${roundTripTimeSec.toFixed(4)} s`;

                    userRangeInput.disabled = false;
                    submitBtn.disabled = false;
                    userRangeInput.focus();
                    instructionEl.textContent = "Pulse returned! Calculate and enter the range below.";
                    instructionEl.style.opacity = '1';
                }
            }
        }

        function drawStars() {
            bgStars.forEach(s => {
                const alpha = 0.3 + 0.4 * Math.abs(Math.sin(s.tw + Date.now() / 900));
                ctx.fillStyle = `rgba(148, 163, 184, ${alpha.toFixed(2)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawRadarStation() {
            const x = radarPos.x;
            const y = radarPos.y;

            // Base tower
            ctx.fillStyle = '#475569';
            ctx.fillRect(x - 6, y - 22, 12, 22);

            // Small hut at base
            ctx.fillStyle = '#334155';
            ctx.fillRect(x - 20, y - 4, 40, 4);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.strokeRect(x - 20, y - 4, 40, 4);

            // Rotating dish assembly, pivoted at top of tower
            const pivotY = y - 22;
            ctx.save();
            ctx.translate(x, pivotY);

            // subtle back-and-forth sweep instead of full spin
            const sweep = Math.sin(dishAngle) * 0.5; // radians
            ctx.rotate(sweep);

            // dish support strut
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -16);
            ctx.stroke();

            // dish (parabolic arc)
            ctx.beginPath();
            ctx.arc(0, -16, 16, Math.PI * 0.15, Math.PI * 0.85, false);
            ctx.lineWidth = 5;
            ctx.strokeStyle = var_accent();
            ctx.lineCap = 'round';
            ctx.stroke();

            // dish feed horn
            ctx.beginPath();
            ctx.arc(0, -16, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#f8fafc';
            ctx.fill();

            ctx.restore();

            // small blinking light on tower
            const blink = 0.5 + 0.5 * Math.sin(Date.now() / 300);
            ctx.beginPath();
            ctx.arc(x, y - 26, 2.2, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(248, 113, 113, ${blink.toFixed(2)})`;
            ctx.fill();
        }

        function var_accent() {
            return '#38bdf8';
        }

        function drawAirplane() {
            const x = planePos.x;
            const y = planePos.y;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(planeAngle);

            // subtle glow
            ctx.shadowColor = 'rgba(56, 189, 248, 0.5)';
            ctx.shadowBlur = 8;

            // fuselage
            ctx.fillStyle = '#e2e8f0';
            ctx.beginPath();
            ctx.moveTo(-16, 0);
            ctx.lineTo(14, 0);
            ctx.lineTo(18, 1.5);
            ctx.lineTo(14, 3);
            ctx.lineTo(-16, 3);
            ctx.closePath();
            ctx.fill();

            // main wings
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.moveTo(-2, -1);
            ctx.lineTo(-16, -14);
            ctx.lineTo(-10, -14);
            ctx.lineTo(4, -1);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-2, 4);
            ctx.lineTo(-16, 17);
            ctx.lineTo(-10, 17);
            ctx.lineTo(4, 4);
            ctx.closePath();
            ctx.fill();

            // tail fin
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.moveTo(-16, 1.5);
            ctx.lineTo(-24, -7);
            ctx.lineTo(-19, 1.5);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;

            // cockpit dot
            ctx.beginPath();
            ctx.arc(10, 1.5, 1.6, 0, Math.PI * 2);
            ctx.fillStyle = '#38bdf8';
            ctx.fill();

            ctx.restore();
        }

        function drawScene() {
            ctx.clearRect(0, 0, width, height);
            drawStars();

            // Ground Line
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, height - 50);
            ctx.lineTo(width, height - 50);
            ctx.stroke();

            drawRadarStation();
            drawAirplane();

            // Radar Beam / Dotted Expanding Pulse
            if (state === 'TRANSMITTING' || state === 'RETURNING' || state === 'ANSWERING') {
                let currentBeamEnd = { x: 0, y: 0 };
                const pivotY = radarPos.y - 38;

                if (pulseProgress <= 1.0) {
                    currentBeamEnd.x = radarPos.x + (planePos.x - radarPos.x) * pulseProgress;
                    currentBeamEnd.y = pivotY + (planePos.y - pivotY) * pulseProgress;
                } else {
                    let returnProgress = pulseProgress - 1.0;
                    currentBeamEnd.x = planePos.x + (radarPos.x - planePos.x) * returnProgress;
                    currentBeamEnd.y = planePos.y + (pivotY - planePos.y) * returnProgress;
                }

                ctx.strokeStyle = 'rgba(56, 189, 248, 0.9)';
                ctx.lineWidth = 3;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(radarPos.x, pivotY);
                ctx.lineTo(currentBeamEnd.x, currentBeamEnd.y);
                ctx.stroke();
                ctx.setLineDash([]);

                // pulse dot with glow
                ctx.beginPath();
                ctx.arc(currentBeamEnd.x, currentBeamEnd.y, 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function loop() {
            updateAnimation();
            drawScene();
            requestAnimationFrame(loop);
        }

        loop();

        function checkAnswer() {
            const userVal = parseFloat(userRangeInput.value);
            if (isNaN(userVal)) {
                feedbackEl.textContent = "Please enter a valid number.";
                feedbackEl.className = 'error';
                return;
            }

            const correctRangeKm = Math.round(actualRangeMeters / 1000);
            const tolerance = 1;

            if (Math.abs(userVal - correctRangeKm) <= tolerance) {
                feedbackEl.textContent = `Correct! The range to the airplane is exactly ${correctRangeKm} km.`;
                feedbackEl.className = 'success';
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'inline-block';
                userRangeInput.disabled = true;
            } else {
                feedbackEl.textContent = `Incorrect. The correct answer was ${correctRangeKm} km.`;
                feedbackEl.className = 'error';
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'inline-block';
                userRangeInput.disabled = true;
            }
        }

        function nextRound() {
            state = 'IDLE';
            pulseProgress = 0;
            timeDisplay.textContent = '-- s';
            userRangeInput.value = '';
            userRangeInput.disabled = true;
            submitBtn.disabled = true;
            submitBtn.style.display = 'inline-block';
            nextBtn.style.display = 'none';
            feedbackEl.textContent = '';
            instructionEl.textContent = "Click the airplane to transmit a new radar pulse!";
            instructionEl.style.opacity = '1';
            resetPlanePosition();
        }
    </script>
</body>
</html>
